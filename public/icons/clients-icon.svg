<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Central hub node -->
  <circle cx="50" cy="42" r="9.5" fill="#ef4444"/>
  <!-- Outer nodes -->
  <circle cx="20" cy="22" r="7" fill="#ef4444"/>
  <circle cx="80" cy="22" r="7" fill="#ef4444"/>
  <circle cx="16" cy="70" r="7" fill="#ef4444"/>
  <circle cx="84" cy="70" r="7" fill="#ef4444"/>
  <circle cx="50" cy="84" r="7" fill="#ef4444"/>
  <!-- Connections from center -->
  <line x1="50" y1="42" x2="20" y2="22" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="50" y1="42" x2="80" y2="22" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="50" y1="42" x2="16" y2="70" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="50" y1="42" x2="84" y2="70" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="50" y1="42" x2="50" y2="84" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Cross-connections (ring) -->
  <line x1="16" y1="70" x2="50" y2="84" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="84" y1="70" x2="50" y2="84" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
</svg>